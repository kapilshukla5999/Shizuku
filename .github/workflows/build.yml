name: Build APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate fresh signing keystore
        run: |
          rm -f signing.properties key.jks
          keytool -genkeypair -v -keystore key.jks -storetype JKS \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias swiggy -storepass swiggy123 -keypass swiggy123 \
            -dname "CN=Swiggy, OU=Dev, O=Swiggy, L=Delhi, S=Delhi, C=IN"
          printf "KEYSTORE_FILE=key.jks\nKEYSTORE_PASSWORD=swiggy123\nKEYSTORE_ALIAS=swiggy\nKEYSTORE_ALIAS_PASSWORD=swiggy123\n" > signing.properties
          ls -la key.jks signing.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: swiggy-debug-apk
          path: manager/build/outputs/apk/debug/*.apk
